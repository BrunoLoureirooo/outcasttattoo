<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Outcast Tattoo — Logo SVG (split: center + ring)
  Two separate path groups for independent animation.
-->
<svg
   version="1.1"
   id="logo"
   width="400"
   height="400"
   viewBox="0 0 400 400"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="mask-center">
      <rect width="400" height="400" fill="white"/>
      <path fill="black" d=" "/>
    </mask>
    <mask id="mask-ring">
      <rect width="400" height="400" fill="white"/>
      <path fill="black" d=" logo"/>
    </mask>
  </defs>
  <!-- Center character -->
  <rect id="logo-center" width="400" height="400" fill="white" mask="url(#mask-center)"/>
  <!-- Barbed wire ring -->
  <rect id="logo-ring" width="400" height="400" fill="white" mask="url(#mask-ring)"/>
</svg>
